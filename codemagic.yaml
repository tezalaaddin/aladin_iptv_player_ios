workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter Dependencies
        script: |
          flutter precache --ios
          flutter pub get
      - name: Isar Code Gen
        script: |
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Force Flutter Assembly (Unsigned)
        script: |
          # 1. Flutter framework'lerini hazırla
          # Bu komut sadece frameworkleri ve assetleri oluşturur
          flutter build ios --release --no-codesign --no-bundle || true
          
          # 2. Projeyi Xcode ile derle (İmzasız)
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            OBJROOT=$CM_BUILD_DIR/build/ios/obj \
            SYMROOT=$CM_BUILD_DIR/build/ios/sym \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            clean build | xcpretty
            
      - name: Manual Assembly (The Fix)
        script: |
          # Codemagic'in aradığı yere klasörü aç
          FINAL_APP="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          mkdir -p "$FINAL_APP"
          
          # A) Xcode'un ürettiği ana binary dosyasını kopyala
          SRC_APP=$(find $CM_BUILD_DIR/build/ios/sym -name "Runner.app" | head -n 1)
          cp -a "$SRC_APP/." "$FINAL_APP/"
          
          # B) Flutter Engine ve App framework'lerini kopyala
          mkdir -p "$FINAL_APP/Frameworks"
          cp -R ios/Flutter/App.framework "$FINAL_APP/Frameworks/" || true
          cp -R $FLUTTER_ROOT/bin/cache/artifacts/engine/ios/Flutter.xcframework/ios-arm64/Flutter.framework "$FINAL_APP/Frameworks/" || true
          
          # C) Assetleri (Resimler, fontlar vb.) kopyala
          cp -R build/flutter_assets "$FINAL_APP/" || true
          
          # D) Plugin framework'lerini (media_kit vb.) topla ve kopyala
          find $CM_BUILD_DIR/build/ios/sym -name "*.framework" -not -path "*App.framework*" -not -path "*Flutter.framework*" -exec cp -R {} "$FINAL_APP/Frameworks/" \; || true
          
          # BOYUT KONTROLÜ
          echo "Final Paket Boyutu:"
          du -sh "$FINAL_APP"

    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - tuz.alaaddin@gmail.com
