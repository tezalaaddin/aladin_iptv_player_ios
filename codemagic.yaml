workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter Dependencies
        script: |
          flutter precache --ios
          flutter pub get
      - name: Isar Code Gen
        script: |
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Force Release AOT Generation
        script: |
          # 1. Tertemiz bir başlangıç
          flutter clean
          flutter pub get
          
          # 2. Release Beyin (App.framework) Üretimi
          # Bu komut tam olarak senin çalışan build'indeki yapıyı üretir.
          flutter build ios --release --no-codesign || true
          
      - name: Xcode Production Build
        script: |
          cd ios
          # Sahte imza ile gerçek binary (Kalp) üretimini zorla
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build | xcpretty
            
      - name: Blueprint Assembly (Build 26)
        script: |
          # 1. Hedef klasörü senin çalışan versiyonun gibi hazırla
          FINAL_APP="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          rm -rf "$FINAL_APP"
          mkdir -p "$FINAL_APP/Frameworks"
          
          # 2. İSKELETİ AL (Xcode çıktısından Runner binary'sini al)
          REAL_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*/Release-iphoneos/*" | xargs ls -td | head -n 1)
          cp -a "$REAL_APP/." "$FINAL_APP/"
          
          # 3. BEYİN (App.framework) YERLEŞİMİ
          # Senin çalışan listende olduğu gibi Frameworks içine koyuyoruz.
          echo "Release Beyin enjekte ediliyor..."
          rm -rf "$FINAL_APP/Frameworks/App.framework"
          cp -R build/ios/iphoneos/App.framework "$FINAL_APP/Frameworks/"
          
          # 4. MOTOR (Flutter.framework Release) YERLEŞİMİ
          echo "Release Motor (SDK'dan) enjekte ediliyor..."
          ENGINE_RELEASE="$FLUTTER_ROOT/bin/cache/artifacts/engine/ios-release/Flutter.xcframework/ios-arm64/Flutter.framework"
          rm -rf "$FINAL_APP/Frameworks/Flutter.framework"
          cp -R "$ENGINE_RELEASE" "$FINAL_APP/Frameworks/"
          
          # 5. TÜM PLUGINLERİ VE BUNDLE'LARI TOPLA
          echo "Pluginler ve paketler toplanıyor..."
          find ~/Library/Developer/Xcode/DerivedData -name "*.framework" -path "*/Release-iphoneos/*" -not -name "App.framework" -not -name "Flutter.framework" -exec cp -R {} "$FINAL_APP/Frameworks/" \; || true
          find ~/Library/Developer/Xcode/DerivedData -name "*.bundle" -path "*/Release-iphoneos/*" -exec cp -R {} "$FINAL_APP/" \; || true
          
          # 6. KRİTİK DOSYALAR (libswift vb.)
          cp "$REAL_APP/Frameworks/libswift_Concurrency.dylib" "$FINAL_APP/Frameworks/" || true
          
          # 7. KİMLİK VE EXECUTABLE
          echo "APPL????" > "$FINAL_APP/PkgInfo"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Runner" "$FINAL_APP/Info.plist" || true

      - name: Final Integrity Check Build 26
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          echo "--- BLUEPRINT KONTROL (Release?) ---"
          ls -F "$APP_PATH"
          echo "Frameworks içeriği:"
          ls "$APP_PATH/Frameworks"
          du -sh "$APP_PATH"
          [ -d "$APP_PATH/Frameworks/App.framework/flutter_assets" ] && echo "✅ Beyin ve Assetler İçeride" || echo "⚠️ Assetler kök dizinde aranacak"
          
    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - tuz.alaaddin@gmail.com
