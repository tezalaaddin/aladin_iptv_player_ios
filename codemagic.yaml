workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter Dependencies
        script: |
          flutter precache --ios
          flutter pub get
      - name: Isar Code Gen
        script: |
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Hardcore Assembly (Build 18 - Final)
        script: |
          # 1. Flutter Derlemesi
          flutter build ios --release --no-codesign || true
          
          # 2. Xcode Derlemesi
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build | xcpretty
            
          # 3. MANUEL MONTAJ
          FINAL_APP="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          rm -rf "$FINAL_APP"
          mkdir -p "$FINAL_APP/Frameworks"
          
          # A) Kaynak Uygulamayı Bul
          REAL_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*/Release-iphoneos/*" | xargs ls -td | head -n 1)
          echo "Kaynak: $REAL_APP"
          
          # B) Ana dosyaları kopyala
          cp "$REAL_APP/Runner" "$FINAL_APP/"
          cp "$REAL_APP/Info.plist" "$FINAL_APP/"
          echo "APPL????" > "$FINAL_APP/PkgInfo"
          
          # C) App.framework (Beyin) kopyala
          APP_FW=$(find "$REAL_APP" -name "App.framework" -type d | head -n 1)
          cp -R "$APP_FW" "$FINAL_APP/Frameworks/"
          
          # D) Flutter Motorunu kopyala
          cp -R "$FLUTTER_ROOT/bin/cache/artifacts/engine/ios/Flutter.xcframework/ios-arm64/Flutter.framework" "$FINAL_APP/Frameworks/"
          
          # E) Pluginleri topla
          find "$REAL_APP/Frameworks" -name "*.framework" -not -name "App.framework" -not -name "Flutter.framework" -exec cp -R {} "$FINAL_APP/Frameworks/" \; || true
          
          # F) KRİTİK: Assetleri ANA DİZİNE taşı (Runner.app/flutter_assets)
          # Eğer App.framework içindeyse oradan çek, yoksa build klasöründen al
          if [ -d "$FINAL_APP/Frameworks/App.framework/flutter_assets" ]; then
            cp -R "$FINAL_APP/Frameworks/App.framework/flutter_assets" "$FINAL_APP/"
          else
            cp -R "$CM_BUILD_DIR/build/flutter_assets" "$FINAL_APP/" || true
          fi
          
          # G) Bundle dosyalarını kopyala
          find "$REAL_APP" -maxdepth 1 -name "*.bundle" -exec cp -R {} "$FINAL_APP/" \; || true

      - name: Final Integrity Check
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          echo "--- DOSYA KONTROLÜ ---"
          [ -f "$APP_PATH/Runner" ] && echo "✅ Runner Binary: OK"
          [ -f "$APP_PATH/Info.plist" ] && echo "✅ Info.plist: OK"
          [ -d "$APP_PATH/Frameworks/App.framework" ] && echo "✅ App.framework: OK"
          [ -d "$APP_PATH/flutter_assets" ] && echo "✅ Assets: OK (Ana dizinde)"
          du -sh "$APP_PATH"
          
    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - tuz.alaaddin@gmail.com
