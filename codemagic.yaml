workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter Dependencies
        script: |
          flutter precache --ios
          flutter pub get
      - name: Isar Code Gen
        script: |
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Hardcore Assembly (Build 19 - Final)
        script: |
          # 1. Flutter Derlemesi (AOT, Assets.car ve Frameworkler üretir)
          flutter build ios --release --no-codesign || true
          
          # 2. Xcode Derlemesi (Ad-hoc imza ile Runner binary üretir)
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build | xcpretty
            
          # 3. MANUEL MONTAJ (Ultimate Merge)
          FINAL_APP="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          
          # A) Kaynakları Bul
          REAL_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*/Release-iphoneos/*" | xargs ls -td | head -n 1)
          echo "Kaynak (Xcode): $REAL_APP"
          
          # B) Önce Flutter'ın ürettiği iskeleti kullan (Assets.car ve Storyboardlar için)
          # Eğer flutter build ios başarılı olduysa burası doludur
          FLUTTER_APP="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          
          # C) Xcode'un ürettiği Binary ve Plist'i üzerine yaz
          cp "$REAL_APP/Runner" "$FINAL_APP/"
          cp "$REAL_APP/Info.plist" "$FINAL_APP/"
          echo "APPL????" > "$FINAL_APP/PkgInfo"
          
          # D) EKSİK PARÇALARI DOLDUR (Assets.car, Base.lproj vb.)
          echo "Eksik görseller aranıyor..."
          find "$REAL_APP" -maxdepth 1 -name "Assets.car" -exec cp {} "$FINAL_APP/" \; || true
          find "$REAL_APP" -maxdepth 1 -name "*.lproj" -exec cp -R {} "$FINAL_APP/" \; || true
          find "$REAL_APP" -maxdepth 1 -name "*.storyboardc" -exec cp -R {} "$FINAL_APP/" \; || true
          
          # E) Frameworkleri Güncelle
          mkdir -p "$FINAL_APP/Frameworks"
          cp -R "$CM_BUILD_DIR/ios/Flutter/App.framework" "$FINAL_APP/Frameworks/"
          cp -R "$FLUTTER_ROOT/bin/cache/artifacts/engine/ios/Flutter.xcframework/ios-arm64/Flutter.framework" "$FINAL_APP/Frameworks/"
          
          # F) Tüm Pluginleri (media_kit vb.) topla
          find "$REAL_APP/Frameworks" -name "*.framework" -not -name "App.framework" -not -name "Flutter.framework" -exec cp -R {} "$FINAL_APP/Frameworks/" \; || true
          
          # G) Assetleri ana dizine yerleştir
          cp -R "$CM_BUILD_DIR/build/flutter_assets" "$FINAL_APP/" || true

      - name: Final Verification Build 19
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          echo "--- KRİTİK DOSYA KONTROLÜ ---"
          [ -f "$APP_PATH/Runner" ] && echo "✅ Binary"
          [ -f "$APP_PATH/Info.plist" ] && echo "✅ Plist"
          [ -f "$APP_PATH/Assets.car" ] && echo "✅ İkonlar (Assets.car)" || echo "⚠️ İkonlar eksik olabilir"
          [ -d "$APP_PATH/Frameworks/App.framework" ] && echo "✅ Beyin (App)"
          [ -d "$APP_PATH/flutter_assets" ] && echo "✅ Varlıklar (Assets)"
          du -sh "$APP_PATH"
          
    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - tuz.alaaddin@gmail.com
