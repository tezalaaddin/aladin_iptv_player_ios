workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter Dependencies
        script: |
          flutter precache --ios
          flutter pub get
      - name: Isar Code Gen
        script: |
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Force Release AOT Generation
        script: |
          # 1. Ortamı temizle
          flutter clean
          flutter pub get
          
          # 2. Dart kodunu Release modunda makine koduna çevir (İmzasız)
          # Bu komut 'build/aot' veya 'build/ios/iphoneos' içinde App.framework üretir
          flutter build ios --release --no-codesign || true
          
          # 3. Eğer üstteki başarısız olursa 'assemble' ile zorla
          if [ ! -d "build/ios/iphoneos/App.framework" ]; then
            echo "⚠️ Standart build başarısız, assemble ile zorlanıyor..."
            flutter assemble -dTargetPlatform=ios -dBuildMode=release release_ios_bundle_flutter_assets
          fi
          
      - name: Xcode Build (Build 21)
        script: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build | xcpretty
            
      - name: Ultimate Manual Assembly
        script: |
          FINAL_APP="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          rm -rf "$FINAL_APP"
          mkdir -p "$FINAL_APP/Frameworks"
          
          # A) Xcode'un ürettiği İSKELETİ bul
          REAL_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*/Release-iphoneos/*" | xargs ls -td | head -n 1)
          cp -a "$REAL_APP/." "$FINAL_APP/"
          
          # B) BEYİN (App.framework) ARAMA VE ENJEKSİYON
          echo "Release App.framework aranıyor..."
          # Önce build klasörüne bak, sonra clone içine bak
          APP_FW=$(find . -name "App.framework" -type d -path "*Release*" | head -n 1)
          if [ -z "$APP_FW" ]; then APP_FW=$(find . -name "App.framework" -type d | head -n 1); fi
          
          echo "✅ Enjekte edilen Beyin: $APP_FW"
          cp -R "$APP_FW" "$FINAL_APP/Frameworks/"
          
          # C) MOTOR (Flutter.framework) ENJEKSİYON
          cp -R "$FLUTTER_ROOT/bin/cache/artifacts/engine/ios/Flutter.xcframework/ios-arm64/Flutter.framework" "$FINAL_APP/Frameworks/"
          
          # D) TÜM PLUGINLERİ TOPLA (media_kit vb.)
          find ~/Library/Developer/Xcode/DerivedData -name "*.framework" -path "*/Release-iphoneos/*" -not -name "App.framework" -not -name "Flutter.framework" -exec cp -R {} "$FINAL_APP/Frameworks/" \; || true
          
          # E) ASSETLERİ TAŞI
          cp -R "$CM_BUILD_DIR/build/flutter_assets" "$FINAL_APP/" || true
          
          # F) INFO.PLIST GÜNCELLE
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Runner" "$FINAL_APP/Info.plist" || true

      - name: Final Verification Build 21
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          echo "--- FINAL DOSYA KONTROLÜ ---"
          ls -F "$APP_PATH"
          echo "Frameworks:"
          ls "$APP_PATH/Frameworks"
          du -sh "$APP_PATH"
          [ -d "$APP_PATH/Frameworks/App.framework" ] && echo "🚀 HER ŞEY HAZIR!" || exit 1
          
    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - tuz.alaaddin@gmail.com
