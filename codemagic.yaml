workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter Dependencies
        script: |
          flutter precache --ios
          flutter pub get
      - name: Isar Code Gen
        script: |
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build and Collect Everything
        script: |
          # 1. Flutter'ı derle (Hata verse de devam et, dosyalar lazım)
          flutter build ios --release --no-codesign || true
          
          # 2. Xcode ile ana iskeleti derle
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            clean build | xcpretty
          
          # 3. MANUEL BİRLEŞTİRME (Puzzle'ı tamamla)
          FINAL_APP="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          mkdir -p "$FINAL_APP/Frameworks"
          
          # Uygulama Binary'sini bul ve koy
          SRC_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*/Release-iphoneos/*" | head -n 1)
          cp -a "$SRC_APP/." "$FINAL_APP/"
          
          # KRİTİK: App.framework (Uygulamanın asıl kodu buradadır)
          cp -R "$CM_BUILD_DIR/ios/Flutter/App.framework" "$FINAL_APP/Frameworks/" || true
          
          # KRİTİK: Flutter.framework (Motor)
          cp -R "$FLUTTER_ROOT/bin/cache/artifacts/engine/ios/Flutter.xcframework/ios-arm64/Flutter.framework" "$FINAL_APP/Frameworks/" || true
          
          # KRİTİK: Tüm Plugin Frameworkleri (media_kit, isar vb.)
          # Xcode bunları Build/Products/Release-iphoneos/ altında oluşturur
          echo "Pluginler aranıyor ve kopyalanıyor..."
          find ~/Library/Developer/Xcode/DerivedData -name "*.framework" -path "*/Release-iphoneos/*" -exec cp -R {} "$FINAL_APP/Frameworks/" \; || true
          
          # Assetleri (Resimler, Ikonlar) kopyala
          cp -R "$CM_BUILD_DIR/build/flutter_assets" "$FINAL_APP/" || true
          
          # Gereksiz dosyaları temizle (Boyut optimizasyonu)
          rm -rf "$FINAL_APP/_CodeSignature" || true

      - name: Final Integrity Check
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          echo "--- PAKET İÇERİĞİ ---"
          ls "$APP_PATH"
          echo "--- FRAMEWORKS İÇERİĞİ ---"
          ls "$APP_PATH/Frameworks"
          echo "--- BOYUT ---"
          du -sh "$APP_PATH"

    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - tuz.alaaddin@gmail.com
