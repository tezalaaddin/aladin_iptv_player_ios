workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter Dependencies
        script: |
          flutter precache --ios
          flutter pub get
      - name: Isar Code Gen
        script: |
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Force Release AOT Generation
        script: |
          # 1. Ortamı temizle
          flutter clean
          flutter pub get
          
          # 2. Dart kodunu (BEYİN) Release modunda zorla üret
          # Bu komut imza gerektirmez, sadece saf makine kodu üretir.
          flutter assemble -dTargetPlatform=ios -dBuildMode=release -o build/ios/iphoneos release_ios_bundle_flutter_assets
          
      - name: Xcode Production Build
        script: |
          cd ios
          # Sahte imza ile ana binary üretimini zorla
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build | xcpretty
            
      - name: Surgical Assembly (Build 25)
        script: |
          # 1. Hazırlık
          FINAL_APP="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          rm -rf "$FINAL_APP"
          mkdir -p "$FINAL_APP/Frameworks"
          
          # 2. İSKELETİ AL (Xcode çıktısı)
          REAL_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*/Release-iphoneos/*" | xargs ls -td | head -n 1)
          echo "Kaynak Iskelet: $REAL_APP"
          cp -a "$REAL_APP/." "$FINAL_APP/"
          
          # 3. BEYİN ENJEKSİYONU (Zorla ürettiğimiz App.framework)
          echo "Release Beyin enjekte ediliyor..."
          rm -rf "$FINAL_APP/Frameworks/App.framework"
          cp -R build/ios/iphoneos/App.framework "$FINAL_APP/Frameworks/"
          
          # 4. MOTOR ENJEKSİYONU (SDK'daki Gerçek Release Motoru)
          echo "Release Motor enjekte ediliyor..."
          ENGINE_RELEASE="$FLUTTER_ROOT/bin/cache/artifacts/engine/ios-release/Flutter.xcframework/ios-arm64/Flutter.framework"
          rm -rf "$FINAL_APP/Frameworks/Flutter.framework"
          cp -R "$ENGINE_RELEASE" "$FINAL_APP/Frameworks/"
          
          # 5. ASSET VE PLUGIN TOPLAMA
          # Assetleri ana dizine taşı
          cp -R build/ios/iphoneos/App.framework/flutter_assets "$FINAL_APP/" || true
          
          # Tüm pluginleri (media_kit vb.) topla
          find ~/Library/Developer/Xcode/DerivedData -name "*.framework" -path "*/Release-iphoneos/*" -not -name "App.framework" -not -name "Flutter.framework" -exec cp -R {} "$FINAL_APP/Frameworks/" \; || true
          find ~/Library/Developer/Xcode/DerivedData -name "*.bundle" -path "*/Release-iphoneos/*" -exec cp -R {} "$FINAL_APP/" \; || true
          
          # 6. KİMLİK DOĞRULAMA
          echo "APPL????" > "$FINAL_APP/PkgInfo"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Runner" "$FINAL_APP/Info.plist" || true

      - name: Final Integrity Check Build 25
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          echo "--- FINAL RELEASE KONTROL ---"
          ls -F "$APP_PATH"
          echo "Frameworks:"
          ls "$APP_PATH/Frameworks"
          du -sh "$APP_PATH"
          [ -d "$APP_PATH/Frameworks/App.framework" ] && echo "✅ RELEASE BEYİN OK" || exit 1
          [ -d "$APP_PATH/Frameworks/Flutter.framework" ] && echo "✅ RELEASE MOTOR OK" || exit 1
          
    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - tuz.alaaddin@gmail.com
