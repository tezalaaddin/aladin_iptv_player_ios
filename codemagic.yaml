workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter Dependencies
        script: |
          flutter precache --ios
          flutter pub get
      - name: Isar Code Gen
        script: |
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build Unsigned IPA
        script: |
          # 1. Flutter tarafını derle (AOT ve Frameworkler)
          # --no-codesign ile imza hatası alsa bile dosyaları üretir
          flutter build ios --release --no-codesign --verbose || true

          # 2. Framework ve Asset kontrolü/kopyalaması
          # Flutter build bazen çıktı klasörünü temizleyemeyebiliyor
          mkdir -p build/ios/iphoneos/Runner.app/Frameworks
          
          # Engine ve App frameworklerini kopyala
          cp -R ios/Flutter/App.framework build/ios/iphoneos/Runner.app/Frameworks/ || true
          cp -R $FLUTTER_ROOT/bin/cache/artifacts/engine/ios/Flutter.xcframework/ios-arm64/Flutter.framework build/ios/iphoneos/Runner.app/Frameworks/ || true
          
          # Plugin frameworklerini (media_kit vb.) kopyala
          if [ -d "ios/Pods/Target Support Files/Pods-Runner" ]; then
            find ios/Pods -name "*.framework" -exec cp -R {} build/ios/iphoneos/Runner.app/Frameworks/ \; || true
          fi

      - name: Verify Artifact
        script: |
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "Runner.app bulundu. İçerik listeleniyor..."
            ls -R build/ios/iphoneos/Runner.app | head -n 20
            du -sh build/ios/iphoneos/Runner.app
          else
            echo "Runner.app BULUNAMADI! Derleme başarısız."
            exit 1
          fi
    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - tuz.alaaddin@gmail.com
