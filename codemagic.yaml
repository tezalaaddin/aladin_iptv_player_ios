workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter Dependencies
        script: |
          flutter precache --ios
          flutter pub get
      - name: Isar Code Gen
        script: |
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Force Release Build
        script: |
          flutter clean
          flutter pub get
          # Release modunda tüm dosyaları üretir (imza hatasına rağmen)
          flutter build ios --release --no-codesign || true
          
      - name: Xcode Production Build
        script: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build | xcpretty
            
      - name: Atomic Assembly (Build 24)
        script: |
          # 1. Yollar ve Hazırlık
          FINAL_APP="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          
          # A) BEYİN (App.framework) YEDEĞİ - iphoneos altındaki gerçek Release çıktısını al
          mkdir -p $CM_BUILD_DIR/safe_vault
          cp -R build/ios/iphoneos/App.framework $CM_BUILD_DIR/safe_vault/ || \
          cp -R ios/Flutter/App.framework $CM_BUILD_DIR/safe_vault/
          
          # B) MOTOR (Flutter.framework Release) YEDEĞİ
          cp -R $FLUTTER_ROOT/bin/cache/artifacts/engine/ios-release/Flutter.xcframework/ios-arm64/Flutter.framework $CM_BUILD_DIR/safe_vault/
          
          # C) İSKELETİ BUL
          REAL_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*/Release-iphoneos/*" | xargs ls -td | head -n 1)
          echo "Kaynak Iskelet: $REAL_APP"

          # 2. HEDEFİ TEMİZLE VE KUR
          rm -rf "$FINAL_APP"
          mkdir -p "$FINAL_APP/Frameworks"
          
          # 3. PARÇALARI BİRLEŞTİR
          cp -a "$REAL_APP/." "$FINAL_APP/"
          
          # Release Beyin Enjeksiyonu
          rm -rf "$FINAL_APP/Frameworks/App.framework"
          cp -R "$CM_BUILD_DIR/safe_vault/App.framework" "$FINAL_APP/Frameworks/"
          
          # Release Motor Enjeksiyonu
          rm -rf "$FINAL_APP/Frameworks/Flutter.framework"
          cp -R "$CM_BUILD_DIR/safe_vault/Flutter.framework" "$FINAL_APP/Frameworks/"
          
          # Assetleri Ana Dizine Çıkar
          if [ -d "$FINAL_APP/Frameworks/App.framework/flutter_assets" ]; then
             cp -R "$FINAL_APP/Frameworks/App.framework/flutter_assets" "$FINAL_APP/"
          fi
          
          # Tüm Pluginleri Topla
          find ~/Library/Developer/Xcode/DerivedData -name "*.framework" -path "*/Release-iphoneos/*" -not -name "App.framework" -not -name "Flutter.framework" -exec cp -R {} "$FINAL_APP/Frameworks/" \; || true
          
          # Kimlik Bilgileri
          echo "APPL????" > "$FINAL_APP/PkgInfo"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Runner" "$FINAL_APP/Info.plist" || true

      - name: Final Verification Build 24
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          echo "--- KONTROL ---"
          ls -F "$APP_PATH"
          echo "--- FRAMEWORKS ---"
          ls "$APP_PATH/Frameworks"
          du -sh "$APP_PATH"
          [ -d "$APP_PATH/Frameworks/App.framework" ] && echo "✅ RELEASE BEYİN OK" || exit 1
          [ -d "$APP_PATH/Frameworks/Flutter.framework" ] && echo "✅ RELEASE MOTOR OK" || exit 1
          
    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - tuz.alaaddin@gmail.com
