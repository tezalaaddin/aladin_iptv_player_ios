workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter Dependencies
        script: |
          flutter precache --ios
          flutter pub get
      - name: Isar Code Gen
        script: |
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build Unsigned Release (Build 22)
        script: |
          # 1. Temizlik
          flutter clean
          flutter pub get
          
          # 2. Release AOT ve Frameworkleri üret
          # Bu komut 'build/ios/iphoneos' içinde her şeyi oluşturur
          flutter build ios --release --no-codesign || true
          
          # 3. Xcode İskelet Derlemesi
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build | xcpretty
            
      - name: Manual Assembly Release
        script: |
          FINAL_APP="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          rm -rf "$FINAL_APP"
          mkdir -p "$FINAL_APP/Frameworks"
          
          # A) Xcode'un ürettiği İskeleti bul
          REAL_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*/Release-iphoneos/*" | xargs ls -td | head -n 1)
          cp -a "$REAL_APP/." "$FINAL_APP/"
          
          # B) KRİTİK: RELEASE App.framework (BEYİN)
          # Flutter derlemesinin asıl çıktısını alıyoruz
          APP_FW=$(find "$CM_BUILD_DIR/build/ios/iphoneos" -name "App.framework" -type d | head -n 1)
          echo "Release App.framework bulundu: $APP_FW"
          cp -R "$APP_FW" "$FINAL_APP/Frameworks/"
          
          # C) KRİTİK: RELEASE Flutter.framework (MOTOR)
          # SDK içindeki gerçek Release motorunu alıyoruz
          ENGINE_RELEASE="$FLUTTER_ROOT/bin/cache/artifacts/engine/ios-release/Flutter.xcframework/ios-arm64/Flutter.framework"
          echo "Release Engine kopyalanıyor..."
          rm -rf "$FINAL_APP/Frameworks/Flutter.framework"
          cp -R "$ENGINE_RELEASE" "$FINAL_APP/Frameworks/"
          
          # D) Pluginleri ve Bundle'ları Topla
          find ~/Library/Developer/Xcode/DerivedData -name "*.framework" -path "*/Release-iphoneos/*" -not -name "App.framework" -not -name "Flutter.framework" -exec cp -R {} "$FINAL_APP/Frameworks/" \; || true
          find ~/Library/Developer/Xcode/DerivedData -name "*.bundle" -path "*/Release-iphoneos/*" -exec cp -R {} "$FINAL_APP/" \; || true
          
          # E) Assetleri ana dizine yerleştir (Görseller, fontlar)
          cp -R "$CM_BUILD_DIR/build/flutter_assets" "$FINAL_APP/" || true
          
          # F) PkgInfo oluştur ve Info.plist düzelt
          echo "APPL????" > "$FINAL_APP/PkgInfo"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Runner" "$FINAL_APP/Info.plist" || true

      - name: Final Verification
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          echo "--- FINAL DOSYA LİSTESİ ---"
          ls -F "$APP_PATH"
          echo "--- FRAMEWORKS (Release?) ---"
          ls "$APP_PATH/Frameworks"
          [ -d "$APP_PATH/Frameworks/App.framework" ] && echo "✅ Release Beyin Tamam" || exit 1
          [ -d "$APP_PATH/Frameworks/Flutter.framework" ] && echo "✅ Release Motor Tamam" || exit 1
          du -sh "$APP_PATH"
          
    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - tuz.alaaddin@gmail.com
