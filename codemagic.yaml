workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter Dependencies
        script: |
          flutter precache --ios
          flutter pub get
      - name: Isar Code Gen
        script: |
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build and Collect Everything
        script: |
          # 1. Flutter AOT ve Assets üretimi
          flutter build ios --release --no-codesign || true
          flutter build bundle --release
          
          # 2. Xcode Projesini Derle (İmzasız)
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            clean build | xcpretty
          
          # 3. MANUEL BİRLEŞTİRME (Deep Assembly)
          FINAL_APP="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          rm -rf "$FINAL_APP"
          mkdir -p "$FINAL_APP/Frameworks"
          
          # A) Xcode'un ürettiği GERÇEK klasörü bul (En son oluşturulanı al)
          REAL_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*/Release-iphoneos/*" | xargs ls -td | head -n 1)
          echo "Kaynak Uygulama: $REAL_APP"
          
          # B) Kök dosyaları kopyala (Runner binary, Info.plist, PkgInfo)
          cp -a "$REAL_APP/." "$FINAL_APP/"
          
          # C) Dart kodunu (App.framework) zorla enjekte et
          APP_FW=$(find $CM_BUILD_DIR/build/ios/iphoneos -name "App.framework" | head -n 1)
          if [ -z "$APP_FW" ]; then APP_FW=$(find $CM_BUILD_DIR/ios/Flutter -name "App.framework" | head -n 1); fi
          echo "App Framework kopyalanıyor: $APP_FW"
          cp -R "$APP_FW" "$FINAL_APP/Frameworks/" || true
          
          # D) Flutter Motorunu kopyala
          cp -R "$FLUTTER_ROOT/bin/cache/artifacts/engine/ios/Flutter.xcframework/ios-arm64/Flutter.framework" "$FINAL_APP/Frameworks/" || true
          
          # E) Pluginleri (media_kit, isar vb.) topla
          find ~/Library/Developer/Xcode/DerivedData -name "*.framework" -path "*/Release-iphoneos/*" -exec cp -R {} "$FINAL_APP/Frameworks/" \; || true
          
          # F) Assetleri (Görseller) yerleştir
          cp -R "$CM_BUILD_DIR/build/flutter_assets/." "$FINAL_APP/" || true
          
          # Temizlik
          rm -rf "$FINAL_APP/_CodeSignature" || true

      - name: Integrity Check
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          echo "--- KÖK DİZİN ---"
          ls -F "$APP_PATH"
          echo "--- FRAMEWORKS ---"
          ls "$APP_PATH/Frameworks"
          du -sh "$APP_PATH"

    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - tuz.alaaddin@gmail.com
