workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter Dependencies
        script: |
          flutter precache --ios
          flutter pub get
      - name: Isar Code Gen
        script: |
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build Unsigned (xcodebuild method)
        script: |
          # 1. Flutter AOT derlemesi
          flutter build ios --release --no-codesign || true
          
          # 2. Çıktı klasörünü önceden hazırla
          mkdir -p $CM_BUILD_DIR/build/ios/iphoneos
          
          # 3. Manuel xcodebuild (Çıktı yolunu zorlayarak)
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR=$CM_BUILD_DIR/build/ios/iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            clean build | xcpretty

      - name: Export and Verify Artifacts
        script: |
          cd $CM_BUILD_DIR
          
          # Eğer xcodebuild çıktıyı CONFIGURATION_BUILD_DIR'e koymadıysa, DerivedData'dan bul ve çek
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "⚠️ Runner.app hedef klasörde yok, DerivedData taranıyor..."
            FOUND_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*/Release-iphoneos/*" | head -n 1)
            if [ -n "$FOUND_APP" ]; then
              echo "✅ Uygulama bulundu: $FOUND_APP"
              cp -R "$FOUND_APP" build/ios/iphoneos/
            fi
          fi
          
          # Son kontrol
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "🚀 Final Kontrol: Runner.app Hazır!"
            du -sh build/ios/iphoneos/Runner.app
          else
            echo "❌ HATA: Runner.app hiçbir yerde bulunamadı!"
            exit 1
          fi
    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - tuz.alaaddin@gmail.com
