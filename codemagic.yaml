workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter Dependencies
        script: |
          flutter precache --ios
          flutter pub get
      - name: Isar Code Gen
        script: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Initialize iOS Architecture
        script: |
          # Projeyi iOS için hazırla ama Podfile'ı korumaya çalış
          flutter create --platforms=ios .
      - name: Prepare Flutter Frameworks
        script: |
          # Ephemeral klasörünü ve AOT snapshot'ları oluştur
          # Bu adımın başarısız olması normaldir (imza yüzünden), ama dosyalar oluşur
          flutter build ios --release --no-codesign || true
      - name: Configure Unsigned Build
        script: |
          # İmza bypass ayarlarını XCConfig dosyalarına enjekte et
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig
          echo "PROVISIONING_PROFILE=" >> ios/Flutter/Release.xcconfig
          echo "PROVISIONING_PROFILE_SPECIFIER=" >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM=" >> ios/Flutter/Release.xcconfig
          
          # Podfile'ın doğru çalıştığından emin olmak için yerel kopyayı kaldır
          # Çünkü Podfile artık doğrudan SDK'daki podhelper'ı kullanıyor.
          rm -f ios/Flutter/podhelper.rb
      - name: Install Pods
        script: |
          # CocoaPods kurulumu
          cd ios
          pod install
      - name: Build Unsigned Release (xcodebuild)
        script: |
          cd ios
          # Temiz bir build al
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            clean build | xcpretty
      - name: Export Artifacts
        script: |
          mkdir -p build/ios/iphoneos
          # Üretilen Runner.app dosyasını bul ve kopyala
          find ios/build/Release-iphoneos -name "Runner.app" -exec cp -R {} build/ios/iphoneos/ \; 2>/dev/null || \
          find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*/Release-iphoneos/*" -exec cp -R {} build/ios/iphoneos/ \;
    artifacts:
      - build/ios/iphoneos/Runner.app
