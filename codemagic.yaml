workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter Dependencies
        script: |
          flutter precache --ios
          flutter pub get
      - name: Isar Code Gen
        script: |
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build Unsigned (xcodebuild method)
        script: |
          # 1. Flutter AOT derlemesi (Dart kodunu makine koduna çevirir)
          flutter build ios --release --no-codesign --verbose || true
          
          # 2. Xcode projesine gir
          cd ios
          
          # 3. Manuel xcodebuild (İmzalamayı tamamen devre dışı bırakarak paketle)
          # Bu komut Runner.app dosyasını build/ios/iphoneos altında oluşturur
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            clean build | xcpretty

      - name: Verify and List Artifacts
        script: |
          # Codemagic'in aradığı dizine git
          cd $CM_BUILD_DIR
          
          # Dosya gerçekten var mı kontrol et
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ -d "$APP_PATH" ]; then
            echo "✅ Runner.app başarıyla oluşturuldu!"
            du -sh "$APP_PATH"
            # İçindeki kritik dosyaları listele (Frameworks vb)
            ls -d "$APP_PATH/Frameworks" || echo "⚠️ Frameworks klasörü yok!"
          else
            echo "❌ Runner.app BULUNAMADI! Derleme loglarını kontrol edin."
            # Alternatif konumlara bak (DerivedData gibi)
            find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*/Release-iphoneos/*"
            exit 1
          fi
    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - tuz.alaaddin@gmail.com
