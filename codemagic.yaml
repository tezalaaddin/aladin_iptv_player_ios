workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Initialize Environment
        script: |
          # Flutter motorunu ve iOS bağımlılıklarını önceden indir
          flutter precache --ios
          flutter pub get
      - name: Isar code gen
        script: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Setup iOS Project Architecture
        script: |
          # Windows-macOS uyumsuzluğunu gidermek için iOS mimarisini tazeleyelim
          flutter create --platforms=ios .
          # Eksik podhelper.rb dosyasını kopyala
          cp $FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb ios/Flutter/ || true
      - name: Prepare Flutter Frameworks
        script: |
          # Pod kurulumu öncesi Flutter motorunun yerleşmesi için build'i tetikle
          # Bu komut imza hatası verir ama Flutter.xcframework'ü oluşturur
          flutter build ios --release --no-codesign --extra-gen-snapshot-options=--no-use-integer-division || true
      - name: Configure Unsigned Build
        script: |
          # XCConfig dosyalarına imza bypass ayarlarını enjekte et
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_IDENTITY=" >> ios/Flutter/Release.xcconfig
          echo "PROVISIONING_PROFILE=" >> ios/Flutter/Release.xcconfig
          echo "PROVISIONING_PROFILE_SPECIFIER=" >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM=" >> ios/Flutter/Release.xcconfig
      - name: Install Pods
        script: |
          cd ios
          # Temiz kurulum
          rm -rf Pods Podfile.lock
          pod install
      - name: Build Unsigned Release (xcodebuild)
        script: |
          cd ios
          # Flutter'ın kısıtlamalarını aşmak için doğrudan xcodebuild kullanıyoruz
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            clean build | xcpretty
      - name: Export Artifacts
        script: |
          # Build sonucunu doğru klasöre taşıyalım
          mkdir -p build/ios/iphoneos
          cp -R ios/build/Release-iphoneos/Runner.app build/ios/iphoneos/ 2>/dev/null || \
          cp -R ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/Runner.app build/ios/iphoneos/
    artifacts:
      - build/ios/iphoneos/Runner.app
