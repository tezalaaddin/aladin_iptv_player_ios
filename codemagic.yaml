workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter Dependencies
        script: |
          flutter pub get
          flutter precache --ios
      - name: Isar Code Gen
        script: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Initialize iOS Architecture
        script: |
          # Windows-macOS senkronizasyonu için taze mimari kur
          flutter create --platforms=ios .
          cp $FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb ios/Flutter/ || true
      - name: Prepare Flutter Frameworks (AOT)
        script: |
          # Bu adım imza hatası verebilir, kasten '|| true' ile geçiyoruz.
          # Amacımız 'ios/Flutter/ephemeral' klasörünü ve Dart kodunu derlemek.
          flutter build ios --release --no-codesign --extra-gen-snapshot-options=--no-use-integer-division || true
      - name: Configure Unsigned Build
        script: |
          # İmza bypass XCConfig dosyalarına enjekte et
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_IDENTITY=" >> ios/Flutter/Release.xcconfig
          echo "PROVISIONING_PROFILE=" >> ios/Flutter/Release.xcconfig
          echo "PROVISIONING_PROFILE_SPECIFIER=" >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM=" >> ios/Flutter/Release.xcconfig
      - name: Install Pods
        script: |
          # Framework hatasını aşmak için Flutter motorunu projenin içine zorla kopyala
          mkdir -p ios/Flutter/engine
          cp -R $FLUTTER_ROOT/bin/cache/artifacts/engine/ios/Flutter.xcframework ios/Flutter/engine/ || true
          
          cd ios
          pod install
      - name: Build Unsigned Release (xcodebuild)
        script: |
          cd ios
          # Xcode'un en saf build komutu ile paketi üret
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            clean build | xcpretty
      - name: Export Artifacts
        script: |
          mkdir -p build/ios/iphoneos
          cp -R ios/build/Release-iphoneos/Runner.app build/ios/iphoneos/ 2>/dev/null || \
          cp -R ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/Runner.app build/ios/iphoneos/
    artifacts:
      - build/ios/iphoneos/Runner.app
