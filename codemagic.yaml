workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter Dependencies
        script: |
          flutter precache --ios
          flutter pub get
      - name: Isar Code Gen
        script: |
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build and Complete Assembly (Build 14)
        script: |
          # 1. Flutter AOT ve Bundle (Assets) üretimi
          flutter build ios --release --no-codesign || true
          
          # 2. Xcode Derlemesi (İmzasız)
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            clean build | xcpretty
          
          # 3. MANUEL BİRLEŞTİRME (Final Fix)
          FINAL_APP="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          rm -rf "$FINAL_APP"
          mkdir -p "$FINAL_APP/Frameworks"
          
          # A) Xcode'un ürettiği her şeyi kopyala
          DERIVED_DATA_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*/Release-iphoneos/*" | xargs ls -td | head -n 1)
          echo "Kaynak uygulama: $DERIVED_DATA_APP"
          cp -a "$DERIVED_DATA_APP/." "$FINAL_APP/"
          
          # B) App.framework (Dart Kodunuz) - Eksikse zorla kopyala
          if [ ! -d "$FINAL_APP/Frameworks/App.framework" ]; then
            echo "⚠️ App.framework eksik, manuel enjekte ediliyor..."
            APP_FW=$(find "$CM_BUILD_DIR" -name "App.framework" -type d | head -n 1)
            cp -R "$APP_FW" "$FINAL_APP/Frameworks/"
          fi
          
          # C) Assetleri (Resimler vb.) tazeleyerek kopyala
          cp -R "$CM_BUILD_DIR/build/flutter_assets/." "$FINAL_APP/" || true
          
          # D) CFBundleExecutable Kontrolü (iPad'de açılması için şart)
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Runner" "$FINAL_APP/Info.plist" || true

      - name: Verify Build 14
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          echo "--- FINAL DOSYA KONTROLÜ ---"
          ls -F "$APP_PATH"
          echo "Boyut: $(du -sh $APP_PATH)"
          [ -f "$APP_PATH/Runner" ] && echo "✅ Runner Binary Tamam" || exit 1
          [ -f "$APP_PATH/Info.plist" ] && echo "✅ Info.plist Tamam" || exit 1
          
    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - tuz.alaaddin@gmail.com
