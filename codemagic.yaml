workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Isar code gen
        script: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Initialize iOS architecture
        script: |
          flutter create --platforms=ios .
          # Ensure podhelper is present
          cp $FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb ios/Flutter/ || true
      - name: Configure Unsigned Build
        script: |
          # Inject signing bypass into XCConfigs
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_IDENTITY=" >> ios/Flutter/Release.xcconfig
          echo "PROVISIONING_PROFILE=" >> ios/Flutter/Release.xcconfig
          echo "PROVISIONING_PROFILE_SPECIFIER=" >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM=" >> ios/Flutter/Release.xcconfig
      - name: Install Pods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install
      - name: Build Unsigned Release
        script: |
          # Step 1: Force Flutter to prepare all assets and frameworks
          # We ignore the error because we know it will fail on signing check
          flutter build ios --release --no-codesign || true
          
          # Step 2: Manually build the .app using xcodebuild (the only way to truly bypass Team ID check)
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            clean build | xcpretty
            
          # Step 3: Move the resulting .app to the artifacts location
          cd ..
          mkdir -p build/ios/iphoneos
          # Find the app in common build locations
          cp -R ios/build/Release-iphoneos/Runner.app build/ios/iphoneos/ 2>/dev/null || \
          cp -R ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/Runner.app build/ios/iphoneos/
    artifacts:
      - build/ios/iphoneos/Runner.app
