workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter Dependencies
        script: |
          flutter precache --ios
          flutter pub get
      - name: Isar Code Gen
        script: |
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Ultimate Assembly (Build 17)
        script: |
          # 1. Flutter Derlemesi (AOT ve Frameworkler için)
          flutter build ios --release --no-codesign || true
          
          # 2. Xcode Derlemesi (Ad-hoc imza ile)
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build | xcpretty
            
          # 3. MANUEL MONTAJ
          FINAL_APP="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          rm -rf "$FINAL_APP"
          mkdir -p "$FINAL_APP/Frameworks"
          
          # A) Kaynak Uygulama Klasörünü Bul
          REAL_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*/Release-iphoneos/*" | xargs ls -td | head -n 1)
          echo "Kaynak: $REAL_APP"
          
          # B) Runner, Plist ve PkgInfo kopyala
          cp "$REAL_APP/Runner" "$FINAL_APP/"
          cp "$REAL_APP/Info.plist" "$FINAL_APP/"
          echo "APPL????" > "$FINAL_APP/PkgInfo"
          
          # C) App.framework (BEYİN) - Flutter derlemesinden al
          APP_FW=$(find "$CM_BUILD_DIR" -name "App.framework" -type d | grep "Release-iphoneos" | head -n 1)
          if [ -z "$APP_FW" ]; then APP_FW=$(find "$CM_BUILD_DIR/build/ios/iphoneos" -name "App.framework" -type d | head -n 1); fi
          echo "App.framework bulundu: $APP_FW"
          cp -R "$APP_FW" "$FINAL_APP/Frameworks/"
          
          # D) Flutter.framework (MOTOR)
          cp -R "$FLUTTER_ROOT/bin/cache/artifacts/engine/ios/Flutter.xcframework/ios-arm64/Flutter.framework" "$FINAL_APP/Frameworks/"
          
          # E) Tüm Plugin Frameworkleri (Ağaçtaki media_kit vb.)
          find ~/Library/Developer/Xcode/DerivedData -name "*.framework" -path "*/Release-iphoneos/*" -not -name "App.framework" -not -name "Flutter.framework" -exec cp -R {} "$FINAL_APP/Frameworks/" \; || true
          
          # F) Assetler ve Bundle'lar (Manifestler dahil)
          cp -R "$CM_BUILD_DIR/build/flutter_assets/." "$FINAL_APP/" || true
          find ~/Library/Developer/Xcode/DerivedData -name "*.bundle" -path "*/Release-iphoneos/*" -exec cp -R {} "$FINAL_APP/" \; || true

      - name: Integrity Check Build 17
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          echo "--- KONTROL ---"
          ls -F "$APP_PATH"
          echo "Frameworks:"
          ls "$APP_PATH/Frameworks"
          echo "Boyut: $(du -sh $APP_PATH)"
          [ -d "$APP_PATH/Frameworks/App.framework" ] && echo "✅ BEYİN (App.framework) YÜKLENDİ!" || exit 1
          
    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - tuz.alaaddin@gmail.com
