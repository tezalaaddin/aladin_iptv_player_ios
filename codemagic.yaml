workflows:
  ios-release:
    name: iOS Release Build (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Isar code gen
        script: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Install Pods
        script: |
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock
          pod install
      - name: Build iOS (Force Unsigned)
        script: |
          flutter build ios --release --no-codesign --extra-gen-snapshot-options=--no-use-integer-division
          
          # Manuel Archive (Eğer üstteki hata verirse bu yöntem daha garantidir)
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            | xcpretty
    artifacts:
      - build/ios/iphoneos/Runner.app
      - build/ios/ipa/*.ipa
