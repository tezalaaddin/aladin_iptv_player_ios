workflows:
  ios-release:
    name: iOS Release Build (Jailbreak Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter Dependencies
        script: |
          flutter precache --ios
          flutter pub get
      - name: Isar Code Gen
        script: |
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build Unsigned Release (Flutter)
        script: |
          # ÖNEMLİ: flutter create ÇALIŞTIRMA (Ayarlarımızı bozar)
          # Doğrudan flutter build kullan, imza hatasını görmezden gel
          flutter build ios --release --no-codesign --verbose || true
      - name: Embed Frameworks Manually (Fallback)
        script: |
          # Eğer flutter build ios --no-codesign frameworkleri kopyalamadıysa zorla kopyala
          APP_DIR="build/ios/iphoneos/Runner.app"
          if [ -d "$APP_DIR" ]; then
            mkdir -p "$APP_DIR/Frameworks"
            cp -R ios/Flutter/App.framework "$APP_DIR/Frameworks/" 2>/dev/null || true
            cp -R $FLUTTER_ROOT/bin/cache/artifacts/engine/ios/Flutter.xcframework/ios-arm64/Flutter.framework "$APP_DIR/Frameworks/" 2>/dev/null || true
            
            # Assetleri kontrol et
            if [ ! -d "$APP_DIR/Frameworks/App.framework/flutter_assets" ]; then
               cp -R build/flutter_assets "$APP_DIR/" 2>/dev/null || true
            fi
          fi
      - name: List Build Result
        script: |
          echo "Build dizini içeriği:"
          ls -R build/ios/iphoneos/Runner.app || echo "Runner.app bulunamadı!"
          du -sh build/ios/iphoneos/Runner.app || echo "Boyut ölçülemedi"
    artifacts:
      - build/ios/iphoneos/Runner.app
